<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Ads — Boost Research</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:#0B0E13;color:#E0E0E0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:40px}
h1{font-size:24px;color:#03E4D0;margin-bottom:12px}
p{color:#888;font-size:14px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:960px}
a.card{display:block;background:#141414;border:1px solid #222;border-radius:12px;padding:24px;text-decoration:none;transition:all .2s}
a.card:hover{border-color:#03E4D0;transform:translateY(-2px)}
.card h2{color:#fff;font-size:18px;margin-bottom:6px}
.card p{color:#888;font-size:13px;margin:0}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-top:8px}
.live{background:rgba(0,200,83,.15);color:#00C853}
.soon{background:rgba(255,145,0,.15);color:#FF9100}
</style>
</head>
<body>
<div class="container">
<h1>YouTube Ads — Boost Research</h1>
<p>Landing pages por tema de vídeo</p>
<div class="grid">
  <a class="card" href="tema-1/">
    <h2>Tema 1 — Sem tempo para cripto</h2>
    <p>Profissional com patrimônio e sem tempo. Advisor dedicado desde 2016.</p>
    <span class="badge live">LIVE</span>
  </a>
  <a class="card" href="tema-2/">
    <h2>Tema 2 — Portfólio desorganizado</h2>
    <p>Em breve</p>
    <span class="badge soon">EM BREVE</span>
  </a>
  <a class="card" href="tema-3/">
    <h2>Tema 3 — IR e Cripto</h2>
    <p>Em breve</p>
    <span class="badge soon">EM BREVE</span>
  </a>
</div>
</div>
</body>
</html>
