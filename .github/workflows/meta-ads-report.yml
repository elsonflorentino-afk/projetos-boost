name: Meta Ads — Relatório Diário por E-mail

on:
  schedule:
    - cron: '0 12 * * 1-5'  # Seg-Sex 9h BRT (12h UTC)
  workflow_dispatch: # Permite rodar manualmente

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Gerar relatório e enviar e-mail
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          NOTIFY_EMAIL: 'elsonflorentino@boostresearch.com.br'
        run: |
          python3 << 'PYEOF'
          import requests, json, os, base64
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          TOKEN = os.environ.get('META_ACCESS_TOKEN', '')
          NOTIFY = os.environ.get('NOTIFY_EMAIL', '')
          ACCOUNT = 'act_844208497068966'
          BASE = 'https://graph.facebook.com/v19.0'

          campaigns = {
              '120249532341880651': 'C10 E-book 1 Portfólio',
              '120249548737860651': 'C10 E-book 2 Regras Cripto',
              '120245737303650651': 'IR Cripto LP',
          }

          today = datetime.now().strftime('%d/%m/%Y')
          total_spend = 0
          total_leads = 0
          alerts = []
          rows_html = ''

          for cid, name in campaigns.items():
              r = requests.get(f'{BASE}/{cid}/insights', params={
                  'fields': 'campaign_name,spend,impressions,clicks,ctr,actions,cost_per_action_type,frequency,reach',
                  'date_preset': 'yesterday',
                  'access_token': TOKEN,
              })
              data = r.json().get('data', [])
              if not data:
                  rows_html += f'<tr><td style="padding:8px 12px;border-bottom:1px solid #eee;">⏸️ {name}</td><td colspan="5" style="padding:8px 12px;border-bottom:1px solid #eee;color:#888;">Sem dados ontem</td></tr>'
                  continue

              d = data[0]
              spend = float(d.get('spend', 0))
              impressions = int(d.get('impressions', 0))
              ctr = float(d.get('ctr', 0))
              freq = float(d.get('frequency', 0))
              leads = 0
              cpl = 0

              for a in d.get('actions', []):
                  if 'lead' in a.get('action_type', ''):
                      leads = int(a.get('value', 0))
              for a in d.get('cost_per_action_type', []):
                  if 'lead' in a.get('action_type', ''):
                      cpl = float(a.get('value', 0))

              total_spend += spend
              total_leads += leads
              cpl_str = f'R${cpl:.2f}' if cpl > 0 else '—'

              row_alerts = []
              if cpl > 80 and leads > 0:
                  row_alerts.append('CPL alto')
                  alerts.append(f'⚠️ {name}: CPL R${cpl:.2f} (acima de R$80)')
              if freq > 2.5:
                  row_alerts.append('Freq alta')
                  alerts.append(f'⚠️ {name}: Frequência {freq:.1f} (acima de 2.5)')
              if ctr < 0.5 and impressions > 5000:
                  row_alerts.append('CTR baixo')
                  alerts.append(f'⚠️ {name}: CTR {ctr:.2f}% (abaixo de 0.5%)')
              if spend > 150 and leads == 0:
                  row_alerts.append('Sem leads!')
                  alerts.append(f'🔴 {name}: R${spend:.2f} gasto sem nenhum lead')

              status_color = '#ff4444' if row_alerts else '#00b37e'
              status_text = ', '.join(row_alerts) if row_alerts else '✅ OK'

              rows_html += f'''<tr>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;font-weight:600;">{name}</td>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:right;">R${spend:.2f}</td>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center;">{leads}</td>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:right;">{cpl_str}</td>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center;">{ctr:.2f}%</td>
                <td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center;color:{status_color};font-weight:600;">{status_text}</td>
              </tr>'''

          avg_cpl = f'R${total_spend/total_leads:.2f}' if total_leads > 0 else '—'

          alerts_html = ''
          if alerts:
              alerts_html = '<div style="background:#fff3f3;border:1px solid #ff4444;border-radius:8px;padding:16px;margin:16px 0;">'
              alerts_html += '<h3 style="color:#ff4444;margin:0 0 8px;">⚠️ Alertas</h3>'
              for a in alerts:
                  alerts_html += f'<p style="margin:4px 0;font-size:14px;">{a}</p>'
              alerts_html += '</div>'
          else:
              alerts_html = '<div style="background:#f0fff4;border:1px solid #00b37e;border-radius:8px;padding:16px;margin:16px 0;"><p style="color:#00b37e;font-weight:600;margin:0;">✅ Todas as campanhas dentro dos parâmetros</p></div>'

          html_body = f'''
          <html>
          <body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:20px;">
          <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;">
            <div style="background:#000;padding:24px;text-align:center;">
              <img src="https://elsonflorentino-afk.github.io/projetos-boost/assets/logo-boost-white.png" alt="Boost Research" width="150">
            </div>
            <div style="background:#00b37e;height:3px;"></div>
            <div style="padding:24px;">
              <h2 style="color:#1a1a2e;margin:0 0 4px;">📊 Relatório Meta Ads</h2>
              <p style="color:#888;font-size:13px;margin:0 0 20px;">{today} — Dados de ontem</p>
              {alerts_html}
              <table style="width:100%;border-collapse:collapse;font-size:13px;margin:16px 0;">
                <tr style="background:#1a1a2e;color:#fff;">
                  <th style="padding:10px 12px;text-align:left;">Campanha</th>
                  <th style="padding:10px 12px;text-align:right;">Gasto</th>
                  <th style="padding:10px 12px;text-align:center;">Leads</th>
                  <th style="padding:10px 12px;text-align:right;">CPL</th>
                  <th style="padding:10px 12px;text-align:center;">CTR</th>
                  <th style="padding:10px 12px;text-align:center;">Status</th>
                </tr>
                {rows_html}
                <tr style="background:#f8f8f8;font-weight:700;">
                  <td style="padding:10px 12px;">TOTAL</td>
                  <td style="padding:10px 12px;text-align:right;">R${total_spend:.2f}</td>
                  <td style="padding:10px 12px;text-align:center;">{total_leads}</td>
                  <td style="padding:10px 12px;text-align:right;">{avg_cpl}</td>
                  <td colspan="2"></td>
                </tr>
              </table>
              <p style="color:#888;font-size:11px;margin-top:20px;">Relatório automático — Boost Growth Squad</p>
            </div>
          </div>
          </body>
          </html>
          '''

          print(f"Relatório {today}: R${total_spend:.2f} gasto, {total_leads} leads, {len(alerts)} alertas")

          # ── ENVIAR VIA GMAIL API ──
          gmail_creds = os.environ.get('GMAIL_CREDENTIALS', '')
          gmail_token = os.environ.get('GMAIL_TOKEN', '')

          if gmail_creds and gmail_token:
              try:
                  import json as j
                  from google.oauth2.credentials import Credentials
                  from googleapiclient.discovery import build

                  # Restaurar token do secret
                  token_data = j.loads(gmail_token)
                  creds = Credentials.from_authorized_user_info(token_data)

                  service = build('gmail', 'v1', credentials=creds)

                  subject = f"📊 Meta Ads {today}"
                  if alerts:
                      subject += f" — {len(alerts)} alerta(s)"
                  else:
                      subject += " — ✅ Tudo OK"

                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = subject
                  msg['From'] = 'elsonflorentino@boostresearch.com.br'
                  msg['To'] = NOTIFY
                  msg.attach(MIMEText(html_body, 'html'))

                  raw = base64.urlsafe_b64encode(msg.as_bytes()).decode()
                  service.users().messages().send(
                      userId='me',
                      body={'raw': raw}
                  ).execute()

                  print(f"✅ E-mail enviado para {NOTIFY} via Gmail API")
              except Exception as e:
                  print(f"❌ Erro Gmail API: {e}")
                  # Fallback: SMTP simples
                  try:
                      import smtplib
                      gmail_app_password = os.environ.get('GMAIL_APP_PASSWORD', '')
                      gmail_sender = os.environ.get('GMAIL_SENDER', '')
                      if gmail_app_password and gmail_sender:
                          msg = MIMEMultipart('alternative')
                          msg['Subject'] = subject
                          msg['From'] = gmail_sender
                          msg['To'] = NOTIFY
                          msg.attach(MIMEText(html_body, 'html'))
                          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                              server.login(gmail_sender, gmail_app_password)
                              server.send_message(msg)
                          print(f"✅ E-mail enviado via SMTP Gmail")
                  except Exception as e2:
                      print(f"❌ Erro SMTP: {e2}")
          else:
              # Tentar SMTP com App Password (mais simples)
              gmail_app_password = os.environ.get('GMAIL_APP_PASSWORD', '')
              gmail_sender = os.environ.get('GMAIL_SENDER', '')
              if gmail_app_password and gmail_sender:
                  try:
                      import smtplib
                      subject = f"📊 Meta Ads {today}"
                      if alerts:
                          subject += f" — {len(alerts)} alerta(s)"
                      else:
                          subject += " — ✅ Tudo OK"
                      msg = MIMEMultipart('alternative')
                      msg['Subject'] = subject
                      msg['From'] = gmail_sender
                      msg['To'] = NOTIFY
                      msg.attach(MIMEText(html_body, 'html'))
                      with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                          server.login(gmail_sender, gmail_app_password)
                          server.send_message(msg)
                      print(f"✅ E-mail enviado via SMTP Gmail")
                  except Exception as e:
                      print(f"❌ Erro SMTP: {e}")
              else:
                  print("⚠️ Nenhuma credencial Gmail configurada — e-mail não enviado")

          with open('report.txt', 'w') as f:
              f.write(f"Relatório {today}: R${total_spend:.2f} gasto, {total_leads} leads, {len(alerts)} alertas")
          PYEOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: meta-ads-report
          path: report.txt
